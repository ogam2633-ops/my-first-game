<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>HTML 연습</title>
    <style>
        h1 {
            font-size: 50px;
        }

        button {
            background-color: blue; /* 버튼 배경: 파란색 */
            color: white;           /* 버튼 글자: 흰색 */
        }
    </style>
</head>
<body>
    <h1>Hello World</h1>
    <button type="button">시작하기</button>
</body>
</html>
